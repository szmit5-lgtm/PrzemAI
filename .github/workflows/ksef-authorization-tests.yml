name: KSeF authorization tests

on:
  push:
    branches:
      - feature/agent-runtime-finance-mail
    paths:
      - 'lib/ksefOrganizationAccess.js'
      - 'tests/ksefOrganizationAccess.test.js'
      - '.github/workflows/ksef-authorization-tests.yml'
  pull_request:
    paths:
      - 'lib/ksefOrganizationAccess.js'
      - 'tests/ksefOrganizationAccess.test.js'
      - '.github/workflows/ksef-authorization-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated KSeF authorization tests
        run: node --test tests/ksefOrganizationAccess.test.js
