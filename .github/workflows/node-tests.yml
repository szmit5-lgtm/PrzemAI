name: Node tests

on:
  push:
    branches:
      - feature/agent-runtime-finance-mail
      - integration/przemai-next
      - feature/product-readiness
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: przemai_p0_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Product workspace isolation and admin budget E2E
        if: github.head_ref == 'feature/product-readiness' || github.ref == 'refs/heads/feature/product-readiness'
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/przemai_p0_e2e_ci
        run: |
          npx prisma migrate deploy
          node scripts/testWorkspaceToolsE2E.js
      - name: Prepare release browser tests
        if: github.head_ref == 'release/przemai-p0-integration' || github.ref == 'refs/heads/release/przemai-p0-integration' || github.base_ref == 'release/przemai-p0-integration' || github.ref == 'refs/heads/integration/przemai-next'
        run: |
          npm ci --prefix frontend
          mkdir -p "$RUNNER_TEMP/przemai-e2e"
          npm install --prefix "$RUNNER_TEMP/przemai-e2e" --no-save --no-package-lock playwright@1.58.2
          chrome=$(command -v google-chrome || command -v chromium)
          {
            echo "PRZEMAI_CHROMIUM=$chrome"
            echo "NODE_PATH=$RUNNER_TEMP/przemai-e2e/node_modules"
          } >> "$GITHUB_ENV"
      - name: Native Prisma upgrade, rollback and application rehearsal
        if: github.head_ref == 'release/przemai-p0-integration' || github.ref == 'refs/heads/release/przemai-p0-integration' || github.base_ref == 'release/przemai-p0-integration' || github.ref == 'refs/heads/integration/przemai-next'
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/przemai_p0_e2e_ci
          PRZEMAI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          log=$(mktemp)
          if ! {
            bash scripts/testProductionCutover.sh &&
            bash scripts/testNativePrismaRollback.sh &&
            node scripts/testReleaseIntegrationE2E.js &&
            node scripts/testGeneralAgentE2E.js &&
            node scripts/testTelegramChatE2E.js &&
            node scripts/testFinancialAgentE2E.js &&
            if [[ "$GITHUB_REF" == "refs/heads/integration/przemai-next" ]]; then
              PRZEMAI_P1_BROWSER=true node scripts/testFinancialIntelligenceE2E.js;
            fi
          } 2>&1 | tee "$log"; then
            details=$(tail -25 "$log")
            details=${details//%/%25}
            details=${details//$'\r'/%0D}
            details=${details//$'\n'/%0A}
            echo "::error title=Native Prisma rehearsal failed::$details"
            exit 1
          fi
      - name: Mobile package and browser smoke test
        if: github.ref == 'refs/heads/integration/przemai-next'
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          PRZEMAI_MOBILE_API_ORIGIN=https://api.example.test npm run prepare:store
          node browser-smoke.cjs
      - name: Run Node tests
        run: npm test
