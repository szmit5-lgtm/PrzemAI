name: Node tests

on:
  push:
    branches:
      - feature/agent-runtime-finance-mail
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: przemai_p0_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Native Prisma upgrade and rollback rehearsal
        if: github.head_ref == 'release/przemai-p0-integration'
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/przemai_p0_e2e_ci
        run: |
          bash scripts/testNativePrismaRollback.sh
          node scripts/testReleaseIntegrationE2E.js
      - name: Run Node tests
        run: npm test
