name: Frontend authentication tests

on:
  push:
    branches:
      - feature/agent-runtime-finance-mail
    paths:
      - frontend/src/lib/api.js
      - tests/frontend-auth-client.test.js
      - .github/workflows/frontend-auth.yml
  pull_request:
    paths:
      - frontend/src/lib/api.js
      - tests/frontend-auth-client.test.js
      - .github/workflows/frontend-auth.yml

permissions:
  contents: read

jobs:
  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free auth regression tests
        run: node --test tests/frontend-auth-client.test.js
