name: Backend tests

on:
  push:
    branches:
      - feature/agent-runtime-finance-mail
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Test document reporting without external dependencies
        run: node --test tests/document-service.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend unit tests
        run: npm test
